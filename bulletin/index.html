<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kingston Ward · Bulletin</title>
<meta name="description" content="This week's sacrament meeting program and upcoming events for the Kingston Ward.">
<meta name="theme-color" content="#1E4D45">
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="Kingston Ward">
<meta name="application-name" content="Kingston Ward">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ground:#1E4D45; --ground-ink:#FFFFFF; --ground-soft:#D3E3DF;
  --page:#F6F7F5; --card:#FFFFFF; --ink:#1A1F1E; --muted:#5A6462; --soft:#3E4846;
  --line:#ECEEEC; --line-2:#DDE1DF; --btn-line:#CDD3D1;
  --btn-bg:#1E4D45; --btn-bg-hover:#163A34; --btn-ink:#FFFFFF;
  --serif:'Instrument Serif', Georgia, 'Times New Roman', serif;
  --sans:'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#173B35; --ground-soft:#B9D1CB;
    --page:#111514; --card:#1A201F; --ink:#EEF2F0; --muted:#A3AEAB; --soft:#C6CFCC;
    --line:#262E2C; --line-2:#2E3735; --btn-line:#3A4542;
    --btn-bg:#B9D1CB; --btn-bg-hover:#D3E3DF; --btn-ink:#0F1F1C;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--page);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.4}
a{color:inherit}
.wrap{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.hero{background:var(--ground);color:var(--ground-ink);padding:calc(28px + env(safe-area-inset-top)) 24px 36px;display:flex;flex-direction:column;gap:48px}
.ward{font-size:15px;font-weight:600;letter-spacing:.01em}
.when{font-size:14px;color:var(--ground-soft)}
h1{margin:16px 0 0;font-family:var(--sans);font-weight:700;font-size:clamp(40px,12vw,56px);line-height:1;letter-spacing:-.03em}
h1 em{font-style:normal}
.people{padding:24px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;justify-content:space-between;gap:16px;font-size:15px}
.row .k{color:var(--muted)} .row .v{font-weight:600;text-align:right}
.program{margin:0 16px;padding:8px 20px;background:var(--card);border-radius:18px;list-style:none}
.program li{padding:20px 0;border-bottom:1px solid var(--line)}
.program li:last-child{border-bottom:0}
.lbl{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
.hymn{display:block;font-family:var(--serif);font-size:26px;line-height:1.1}
.part{font-family:var(--serif);font-style:italic;font-size:22px;color:var(--soft)}
.program li.row{padding:20px 0}
.notes{margin:20px 16px 0;padding:20px;background:var(--card);border-radius:18px;display:flex;flex-direction:column;gap:14px}
.notes p{margin:0;white-space:pre-line}
.notes h2{font-size:24px;margin:0}
.topic{display:block;font-size:14px;color:var(--muted);margin-top:4px}
.tag{font-size:11px;font-weight:600;color:var(--muted);border:1px solid var(--line-2);border-radius:999px;padding:1px 7px;vertical-align:2px;margin-left:4px}
section.up{padding:36px 24px 0}
h2{margin:0 0 14px;font-family:var(--serif);font-weight:400;font-size:30px}
.ev{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 0;border-top:1px solid var(--line-2)}
.ev .name{font-size:16px;font-weight:600}
.ev .meta{font-size:14px;color:var(--muted)}
.addwrap{position:relative;flex:none}
.add{display:flex;align-items:center;gap:6px;min-height:44px;padding:0 14px;border-radius:12px;border:0;background:var(--btn-bg);color:var(--btn-ink);font:600 14px var(--sans);cursor:pointer}
.add:hover{background:var(--btn-bg-hover)}
.add:focus-visible{outline:3px solid var(--btn-bg);outline-offset:2px}
.add svg{color:currentColor}
.menu{position:absolute;right:0;top:calc(100% + 6px);z-index:5;min-width:230px;white-space:nowrap;background:var(--card);border:1px solid var(--line-2);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.14);padding:6px;display:none}
.menu.open{display:block}
.menu a{display:flex;align-items:center;min-height:44px;padding:0 12px;border-radius:8px;text-decoration:none;font-size:15px}
.menu a:hover,.menu a:focus-visible{background:var(--line)}
.empty{color:var(--muted);font-size:15px;padding:8px 0 0}
footer{margin-top:auto;padding:32px 24px calc(32px + env(safe-area-inset-bottom));font-size:13px;color:var(--muted)}
.status{padding:48px 24px;color:var(--muted)}
.skel{background:var(--line);border-radius:8px;height:18px;margin:10px 0}
.hero{position:relative;overflow:hidden}
.hero > *{position:relative}
.hero-art{position:absolute !important;top:0;right:0;width:70%;height:100%;object-fit:cover;object-position:center 15%;opacity:.55;pointer-events:none;
  -webkit-mask-image:linear-gradient(to left,#000 25%,transparent 100%);mask-image:linear-gradient(to left,#000 25%,transparent 100%)}
.hero-art[hidden]{display:none}
.hero-title{max-width:250px}
.art-credit{margin-top:12px;font-size:12px;line-height:1.35;letter-spacing:.01em;color:var(--ground-soft)}
.art-credit em{font-family:var(--serif);font-size:13px}
.art-credit:empty{display:none}
.weeks{display:flex;gap:8px;margin:20px 16px 0;padding:4px;background:var(--line);border-radius:14px}
.wk{flex:1;min-height:52px;border:0;border-radius:10px;background:transparent;color:var(--muted);font:500 13px var(--sans);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px 8px}
.wk .wk-d{font-size:15px;font-weight:700;color:var(--ink)}
.wk[aria-selected="true"]{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.12);color:var(--ink)}
.wk:focus-visible{outline:3px solid var(--btn-bg);outline-offset:2px}
.weeks + .people{padding-top:20px}
a.hymn-link{text-decoration:underline;text-decoration-color:var(--line-2);text-underline-offset:4px;text-decoration-thickness:1px}
a.hymn-link:hover{text-decoration-color:currentColor}
a.hymn-link .ext{display:inline-block;vertical-align:4px;margin-left:6px;color:var(--muted)}
.tbd{color:var(--muted) !important;font-style:italic;font-weight:400 !important}
.status.pending{margin:20px 16px 0;padding:28px 20px;background:var(--card);border-radius:18px;font-family:var(--serif);font-style:italic;font-size:22px;line-height:1.25;color:var(--soft)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <div class="ward" id="ward">Kingston Ward</div>
    <img class="hero-art" id="heroArt" alt="" hidden>
    <div class="hero-title">
      <div class="when" id="when">&nbsp;</div>
      <h1 id="title">Sacrament meeting</h1>
      <div class="art-credit" id="artCredit"></div>
    </div>
  </header>
  <main id="main"><div class="status"><div class="skel" style="width:60%"></div><div class="skel" style="width:80%"></div><div class="skel" style="width:40%"></div></div></main>
  <footer>kwbishopric.org/bulletin</footer>
</div>

<script>
/* Kingston Ward · public bulletin.
   Reads the bulletin from the "App API" deployment with fn "publicBulletin" — no sign-in.
   That endpoint returns only what is already public on the printed program. */
var API_URL = 'https://script.google.com/macros/s/AKfycbxTmstrn1ETmsEnobIx9-MB12Mw8LCsdHlzGO41-UxkxitVuE224xnl8wTXhK3BlzRo/exec';
var TZ = 'America/Denver';

/* Sample data in the same shape getBulletinData_() returns. Open the page with ?sample to preview. */
var SAMPLE = {
  wardName: 'Kingston Ward', meetingTime: '11:30 AM', today: '2026-10-28',
  meeting: {
    date: '2026-11-01', type: 'Fast & testimony meeting', presiding: '', conducting: 'Ken', chorister: 'Jim Manning', organist: 'Meg Naisbitt',
    openingHymn: '#138 Bless Our Fast, We Pray', sacramentHymn: '#191 Behold the Great Redeemer Die', intermediateHymn: '', musicalNumber: '',
    intermediateAfter: '', closingHymn: '[#] [Hymn title]', invocation: '[Name]', benediction: '[Name]', speakers: '', announcements: ''
  },
  next: [{
    date: '2026-11-08', type: 'Sacrament meeting', presiding: 'Bishop Burton', conducting: 'Brother Johnson, First Counselor', chorister: 'Jim Manning', organist: 'Meg Naisbitt',
    openingHymn: '#1001 Come, Thou Fount of Every Blessing', sacramentHymn: "#176 'Tis Sweet to Sing the Matchless Love (Meredith)", intermediateHymn: '#1009 Gethsemane', musicalNumber: '',
    intermediateAfter: '1', closingHymn: '#2 The Spirit of God', invocation: '[Name]', benediction: '[Name]', speakers: '[Speaker] — [Topic]\n[Speaker] — [Topic]', announcements: ''
  }],
  events: [
    { title: '[Ward event]', date: '2026-11-07', start: '18:00', end: '20:00', location: '[Place]' },
    { title: '[Stake event]', date: '2026-11-14', start: '', end: '', location: '', stake: true }
  ]
};

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function $(id) { return document.getElementById(id); }
function lines(s) { return String(s || '').split('\n').map(function (l) { return l.trim(); }).filter(Boolean); }
function splitSpeaker(line) { var m = String(line).match(/^(.*?)(?:\s+[—–-]\s+|:\s+)(.*)$/); return m ? { n: m[1].trim(), t: m[2].trim() } : { n: String(line).trim(), t: '' }; }
function hymn(label, v) { var m = String(v).match(/^#?\s*(\d+)\s*[.\-–—:]?\s*(.*)$/); return m ? { type: 'hymn', label: label, number: m[1], title: m[2] || '' } : { type: 'hymn', label: label, title: String(v) }; }

/* Denver wall-clock time on a date → an absolute moment (handles daylight saving). */
function zonedIso(ymd, hhmm) {
  var p = ymd.split('-'), t = String(hhmm).split(':');
  var guess = Date.UTC(+p[0], +p[1] - 1, +p[2], +t[0] || 0, +t[1] || 0);
  var parts = {}; new Intl.DateTimeFormat('en-US', { timeZone: TZ, hourCycle: 'h23', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' })
    .formatToParts(new Date(guess)).forEach(function (x) { parts[x.type] = x.value; });
  var shown = Date.UTC(+parts.year, +parts.month - 1, +parts.day, +parts.hour % 24, +parts.minute);
  return new Date(guess + (guess - shown)).toISOString();
}

/* Gospel Library link for a hymn: same title-to-address rule the Church site uses.
   1–341 are the 1985 hymnbook; 1001+ are Hymns—For Home and Church. */
function hymnSlug(t) { return String(t || '').toLowerCase().replace(/[’'‘]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, ''); }
function hymnUrl(number, title) {
  var n = parseInt(number, 10), s = hymnSlug(title);
  if (!n || !s) return '';
  if (n >= 1 && n <= 341) return 'https://www.churchofjesuschrist.org/study/manual/hymns/' + s + '?lang=eng';
  if (n >= 1000) return 'https://www.churchofjesuschrist.org/study/music/hymns-for-home-and-church/' + s + '?lang=eng';
  return '';
}

/* getBulletinData_() → what the page renders. Every published Sunday gets its own full program. */
function normalize(d) {
  var out = { ward: d.wardName || 'Kingston Ward', weeks: [], events: [] };
  [d.meeting].concat(d.next || []).forEach(function (m) { if (m && m.date) out.weeks.push(buildMeeting(m, d.meetingTime)); });
  // Next Sunday isn't published yet: still give it a tab, with only its date.
  if (out.weeks.length === 1) {
    var nx = new Date(ymdDate(out.weeks[0].date).getTime() + 7 * 864e5).toISOString().slice(0, 10);
    out.weeks.push({ title: 'Sacrament meeting', date: nx, time: d.meetingTime || '', roles: [], items: [], announcements: [], note: '', pending: true });
  }
  out.events = (d.events || []).map(function (e, i) {
    var ev = { id: (e.date || '') + '-' + slug(e.title), date: e.date, rawTitle: e.title || '', title: e.title || 'Event', location: e.location || '', stake: !!e.stake };
    if (e.start) { ev.start = zonedIso(e.date, e.start); if (e.end) ev.end = zonedIso(e.date, e.end); }
    else { ev.start = e.date; ev.allDay = true; }
    return ev;
  });
  return out;
}
/* Not decided yet: show a quiet TBD instead of leaving the line out. */
var TBD = 'To be announced';
// The bishop presides unless the app says otherwise. Update when the bishop changes.
var DEFAULT_PRESIDING = 'Bishop Burton';
function hymnOrTbd(label, v) { return v ? hymn(label, v) : { type: 'hymn', label: label, title: TBD, tbd: true }; }
function personOrTbd(label, v) { return v ? { type: 'person', label: label, name: v } : { type: 'person', label: label, name: TBD, tbd: true }; }
function buildMeeting(m, time) {
  var mt;
  {
    var conf = /Conference/.test(m.type || '') && m.type !== 'Ward Conference', fast = /Fast/.test(m.type || '');
    var primary = /Primary Program/i.test(m.type || ''), other = m.type === 'Other';
    var mt = { title: other ? 'Special meeting' : m.type && m.type !== 'Sacrament meeting' ? m.type : 'Sacrament meeting', date: m.date, time: time || '', roles: [], items: [], note: '' };
    if (conf) { mt.time = ''; mt.note = m.type + ' — no sacrament meeting in the ward building today.'; }
    else {
      // A member of the stake presidency usually presides at ward conference, so only the bishop's regular Sundays default to him.
      var presiding = m.presiding || (other || m.type === 'Ward Conference' ? '' : DEFAULT_PRESIDING);
      mt.roles = [['Presiding', presiding], ['Conducting', m.conducting], ['Chorister', m.chorister], ['Organist', m.organist]]
        .map(function (r) { return { label: r[0], name: r[1] || TBD, tbd: !r[1] }; });
      // Same person presiding and conducting: one line, not two.
      if (!mt.roles[0].tbd && mt.roles[0].name === mt.roles[1].name) mt.roles.splice(0, 2, { label: 'Presiding & conducting', name: mt.roles[0].name, tbd: false });
      var it = mt.items;
      it.push(hymnOrTbd('Opening hymn', m.openingHymn));
      it.push(personOrTbd('Invocation', m.invocation));
      it.push({ type: 'part', text: 'Ward & stake business' });
      it.push(hymnOrTbd('Sacrament hymn', m.sacramentHymn));
      it.push({ type: 'part', text: 'Administration of the sacrament' });
      var music = m.musicalNumber ? { type: 'person', label: 'Musical number', name: m.musicalNumber } : m.intermediateHymn ? hymn('Intermediate hymn', m.intermediateHymn) : null;
      if (fast) it.push({ type: 'part', text: 'Bearing of testimonies' });
      else {
        var sp = lines(m.speakers), after = Math.max(1, parseInt(m.intermediateAfter, 10) || 2), placed = false;
        if (primary) it.push({ type: 'part', text: 'Presented by the Primary children' });
        sp.forEach(function (l, i) {
          var s = splitSpeaker(l);
          it.push({ type: 'talk', label: i === sp.length - 1 && sp.length > 1 ? 'Concluding speaker' : 'Speaker', name: s.n, topic: s.t });
          if (music && !placed && i + 1 === after && i < sp.length - 1) { it.push(music); placed = true; }
        });
        if (music && !placed) it.push(music);
        if (!sp.length && !primary) it.push({ type: 'talk', label: 'Speakers', name: TBD, topic: '', tbd: true });
      }
      it.push(hymnOrTbd('Closing hymn', m.closingHymn));
      it.push(personOrTbd('Benediction', m.benediction));
      // "Other" has no set format: show only what was entered.
      if (other) {
        mt.roles = mt.roles.filter(function (r) { return !r.tbd; });
        mt.items = mt.items.filter(function (x) { return !x.tbd && x.type !== 'part'; });
        mt.pending = !mt.roles.length && !mt.items.length;
      }
    }
    mt.announcements = lines(m.announcements).map(function (a) { return { text: a }; });
  }
  return mt;
}

function load() {
  if (/[?&]sample\b/.test(location.search)) return Promise.resolve(SAMPLE);
  return fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: 'publicBulletin' }) })
    .then(function (r) { return r.json(); });
}

/* ---- dates ---- */
function ymdDate(ymd) { var p = ymd.split('-'); return new Date(Date.UTC(+p[0], +p[1] - 1, +p[2], 12)); }
function fmtLongDay(ymd) { return ymdDate(ymd).toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', timeZone: 'UTC' }); }
function isAllDay(ev) { return ev.allDay || /^\d{4}-\d{2}-\d{2}$/.test(ev.start); }
function fmtEventWhen(ev) {
  if (isAllDay(ev)) return ymdDate(ev.start).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', timeZone: 'UTC' });
  var d = new Date(ev.start);
  var day = d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', timeZone: TZ });
  var t = d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', timeZone: TZ }).replace(':00', '');
  return day + ' · ' + t;
}

/* ---- calendar links ---- */
function utcStamp(d) { return d.toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, ''); }
function ymdCompact(ymd) { return ymd.replace(/-/g, ''); }
function nextDay(ymd) { var d = ymdDate(ymd); d.setUTCDate(d.getUTCDate() + 1); return d.toISOString().slice(0, 10); }
function evRange(ev) {
  if (isAllDay(ev)) { var s = ev.start.slice(0, 10); return { allDay: true, s: ymdCompact(s), e: ymdCompact(ev.end ? nextDay(ev.end.slice(0, 10)) : nextDay(s)) }; }
  var start = new Date(ev.start), end = ev.end ? new Date(ev.end) : new Date(start.getTime() + 60 * 60 * 1000);
  return { allDay: false, s: utcStamp(start), e: utcStamp(end) };
}
function googleUrl(ev) {
  var r = evRange(ev);
  var q = 'action=TEMPLATE&text=' + encodeURIComponent(ev.title || '') + '&dates=' + r.s + '/' + r.e;
  if (!r.allDay) q += '&ctz=' + encodeURIComponent(TZ);
  if (ev.location) q += '&location=' + encodeURIComponent(ev.location);
  if (ev.description) q += '&details=' + encodeURIComponent(ev.description);
  return 'https://calendar.google.com/calendar/render?' + q;
}
function slug(s) { return String(s || 'event').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 40) || 'event'; }

var CAL_ICON = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18M12 14v4M10 16h4"/></svg>';

/* ---- render ---- */
function titleHtml(t) {
  // Italicize "testimony" in the fast-meeting title, as in the design; everything else plain.
  return esc(t).replace(/\btestimony\b/i, function (m) { return '<em>' + m + '</em>'; });
}
/* Weekly artwork of the Savior. Each Sunday shows the next painting in this list, in order, so every week differs
   once the list has more than one. Add a painting: put a ~800px-wide JPG in bulletin/art/ and add a line here. */
var ART = [
  { file: 'art/jesus-the-christ-parson.jpg', title: 'Jesus the Christ', artist: 'Del Parson', pos: 'center 15%' },
  { file: 'art/in-remembrance-of-me.jpg', title: 'In Remembrance of Me', artist: 'Walter Rane', pos: '60% 30%' },
  { file: 'art/the-lost-lamb.jpg', title: 'The Lost Lamb', artist: 'Del Parson', pos: 'center 20%' },
  { file: 'art/living-water.jpg', title: 'Living Water', artist: 'Simon Dewey', pos: '35% 35%' },
  { file: 'art/christ-and-the-children.jpg', title: 'Christ and the Children', artist: 'Harry Anderson', pos: '38% 40%' },
  { file: 'art/sermon-on-the-mount.jpg', title: 'The Sermon on the Mount', artist: 'Carl Heinrich Bloch', pos: '55% 20%' },
  { file: 'art/divine-redeemer-dewey.jpg', title: 'Divine Redeemer', artist: 'Simon Dewey', pos: 'center 20%' },
  { file: 'art/washing-the-apostles-feet.jpg', title: 'Jesus Washing the Apostles’ Feet', artist: 'Del Parson', pos: '35% 60%' },
  { file: 'art/mary-and-martha.jpg', title: 'Christ in the Home of Mary and Martha', artist: 'David Lindsley', pos: '80% 40%' },
  { file: 'art/christ-bethesda.jpg', title: 'Christ and Man at Bethesda', artist: 'Bible Videos', pos: '0% 40%' },
  { file: 'art/jesus-at-the-door.jpg', title: 'Jesus at the Door', artist: 'Del Parson', pos: '30% 35%' },
  { file: 'art/jairus-daughter.jpg', title: 'Jesus Blessing Jairus’s Daughter', artist: 'Greg K. Olsen', pos: '25% 30%' },
  { file: 'art/behold-my-hands.jpg', title: 'Behold My Hands and Feet', artist: 'Harry Anderson', pos: '50% 30%' },
  { file: 'art/the-ascension.jpg', title: 'The Ascension', artist: 'Harry Anderson', pos: '60% 20%' }
];
/* Holiday Sundays get their own painting instead of the next one in the rotation. Dates are worked out every year. */
var HOLIDAY_ART = {
  palm:    { file: 'art/triumphal-entry.jpg', title: 'Christ Rides into Jerusalem', artist: 'Bible Videos', pos: '50% 30%' },
  easter:  { file: 'art/he-is-risen.jpg', title: 'He Is Risen', artist: 'Del Parson', pos: 'center 10%' },
  advent:  { file: 'art/road-to-bethlehem.jpg', title: 'The Road to Bethlehem', artist: 'Joseph Brickey', pos: '65% 50%' },
  christmas: { file: 'art/birth-of-jesus.jpg', title: 'The Birth of Jesus', artist: '', pos: '50% 55%' },
  primary: { file: 'art/christ-and-the-children.jpg', title: 'Christ and the Children', artist: 'Harry Anderson', pos: '38% 40%' }
};
// Western Easter (Anonymous Gregorian algorithm) → 'yyyy-MM-dd'.
function easterOf(y) {
  var a = y % 19, b = Math.floor(y / 100), c = y % 100, d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3);
  var h = (19 * a + b - d - g + 15) % 30, i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451);
  var mo = Math.floor((h + l - 7 * m + 114) / 31), da = ((h + l - 7 * m + 114) % 31) + 1;
  return y + '-' + String(mo).padStart(2, '0') + '-' + String(da).padStart(2, '0');
}
function holidayFor(ymd, type) {
  if (/primary program/i.test(type || '')) return HOLIDAY_ART.primary;   // the meeting's type, set in the app
  var y = +ymd.slice(0, 4), md = ymd.slice(5), easter = easterOf(y);
  var palm = new Date(ymdDate(easter).getTime() - 7 * 864e5).toISOString().slice(0, 10);
  if (ymd === easter) return HOLIDAY_ART.easter;
  if (ymd === palm) return HOLIDAY_ART.palm;
  if (md >= '12-19' && md <= '12-25') return HOLIDAY_ART.christmas;   // the Sunday before Christmas, or Christmas Day
  if (md >= '12-12' && md <= '12-18') return HOLIDAY_ART.advent;      // the Sunday before that
  return null;
}
function artFor(ymd, type) {
  if (!ymd) return null;
  var hol = holidayFor(ymd, type); if (hol) return hol;
  if (!ART.length) return null;
  // Counted from Sunday, Nov 1, 2026 (the first painting in the list).
  var weeks = Math.round((ymdDate(ymd).getTime() - ymdDate('2026-11-01').getTime()) / (7 * 864e5));
  return ART[((weeks % ART.length) + ART.length) % ART.length];
}
function showArt(ymd, type) {
  var a = artFor(ymd, type), img = $('heroArt'), cr = $('artCredit');
  if (!a) { img.hidden = true; cr.textContent = ''; return; }
  if (img.getAttribute('src') !== a.file) { img.hidden = true; img.onload = function () { img.hidden = false; }; img.onerror = function () { img.hidden = true; }; img.src = a.file; }
  img.style.objectPosition = a.pos || 'center 15%';
  cr.innerHTML = '<em>' + esc(a.title) + '</em>' + (a.artist ? ' · ' + esc(a.artist) : '');
}
function fmtTab(ymd) { return ymdDate(ymd).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', timeZone: 'UTC' }); }
var STATE = { d: null, raw: null, week: 0 };
function render(raw) {
  var d = normalize(raw);
  STATE.d = d; STATE.raw = raw;
  var want = (location.hash.match(/^#(\d{4}-\d{2}-\d{2})$/) || [])[1], w = 0;
  d.weeks.forEach(function (x, i) { if (x.date === want) w = i; });
  STATE.week = w;
  $('ward').textContent = d.ward;
  document.title = d.ward + ' · Bulletin';
  paint();
}
function paint() {
  var d = STATE.d, raw = STATE.raw, m = d.weeks[STATE.week];
  var h = '';
  if (d.weeks.length > 1) {
    h += '<nav class="weeks" role="tablist" aria-label="Choose a Sunday">' + d.weeks.map(function (x, i) {
      var sel = i === STATE.week;
      return '<button type="button" role="tab" class="wk" data-week="' + i + '" aria-selected="' + sel + '"' + (sel ? '' : ' tabindex="-1"') + '>' +
        '<span class="wk-k">' + (i === 0 ? 'This Sunday' : i === 1 ? 'Next Sunday' : 'Later') + '</span><span class="wk-d">' + esc(fmtTab(x.date)) + '</span></button>';
    }).join('') + '</nav>';
  }
  if (!m) {
    $('when').textContent = raw.meetingTime ? 'Sundays · ' + raw.meetingTime : '';
    $('title').innerHTML = 'Sacrament meeting';
    h += '<p class="status">This week’s program is being prepared. Check back soon.</p>';
  } else {
    $('when').textContent = (m.date ? fmtLongDay(m.date) : '') + (m.time ? ' · ' + m.time : '');
    $('title').innerHTML = titleHtml(m.title);
    showArt(m.date, m.title);
    if (m.note) h += '<p class="status">' + esc(m.note) + '</p>';
    if (m.pending) h += '<p class="status pending">Program coming soon. Check back later this week.</p>';
    if (m.roles.length) {
      h += '<section class="people" aria-label="Meeting leaders">' + m.roles.map(function (r) {
        return '<div class="row"><span class="k">' + esc(r.label) + '</span><span class="v' + (r.tbd ? ' tbd' : '') + '">' + esc(r.name) + '</span></div>';
      }).join('') + '</section>';
    }
    if (m.items.length) {
      h += '<ol class="program" aria-label="Order of meeting">' + m.items.map(function (it) {
        if (it.type === 'hymn') {
          var no = it.number ? ' · No. ' + esc(it.number) : '', url = hymnUrl(it.number, it.title);
          var title = url ? '<a class="hymn hymn-link" href="' + esc(url) + '" target="_blank" rel="noopener">' + esc(it.title) + LINK_ICON + '</a>'
            : '<span class="hymn' + (it.tbd ? ' tbd' : '') + '">' + esc(it.title) + '</span>';
          return '<li><span class="lbl">' + esc(it.label) + no + '</span>' + title + '</li>';
        }
        if (it.type === 'talk') {
          return '<li><span class="lbl">' + esc(it.label) + '</span><span class="hymn' + (it.tbd ? ' tbd' : '') + '">' + esc(it.name) + '</span>' + (it.topic ? '<span class="topic">' + esc(it.topic) + '</span>' : '') + '</li>';
        }
        if (it.type === 'person') {
          return '<li class="row"><span class="k">' + esc(it.label) + '</span><span class="v' + (it.tbd ? ' tbd' : '') + '">' + esc(it.name) + '</span></li>';
        }
        return '<li><span class="part">' + esc(it.text) + '</span></li>';
      }).join('') + '</ol>';
    }
  }
  var ann = m ? m.announcements || [] : [];
  if (ann.length) {
    h += '<section class="notes" aria-labelledby="ann-h"><h2 id="ann-h">Announcements</h2>' + ann.map(function (a) {
      return '<p>' + esc(a.text) + '</p>';
    }).join('') + '</section>';
  }
  var evs = d.events;
  h += '<section class="up" aria-labelledby="up-h"><h2 id="up-h">Coming up</h2>';
  if (!evs.length) h += '<p class="empty">Nothing on the calendar yet.</p>';
  h += evs.map(function (ev, i) {
    var ics = API_URL + '?page=ics&d=' + encodeURIComponent(ev.date || '') + '&t=' + encodeURIComponent(ev.rawTitle || '');
    var meta = fmtEventWhen(ev) + (ev.location ? ' · ' + esc(ev.location) : '');
    return '<div class="ev"><div><div class="name">' + esc(ev.title) + (ev.stake ? ' <span class="tag">Stake</span>' : '') + '</div><div class="meta">' + meta + '</div></div>' +
      '<div class="addwrap"><button type="button" class="add" aria-haspopup="true" aria-expanded="false" aria-controls="m' + i + '" aria-label="Add ' + esc(ev.title) + ' to calendar">' + CAL_ICON + 'Add to calendar</button>' +
      '<div class="menu" id="m' + i + '" role="menu">' +
        '<a role="menuitem" href="' + esc(ics) + '">Apple, Outlook &amp; others</a>' +
        '<a role="menuitem" href="' + esc(googleUrl(ev)) + '" target="_blank" rel="noopener">Google Calendar</a>' +
      '</div></div></div>';
  }).join('');
  h += '</section>';
  $('main').innerHTML = h;
}
function pickWeek(i, focus) {
  if (i < 0 || i >= STATE.d.weeks.length || i === STATE.week) return;
  STATE.week = i;
  try { history.replaceState(null, '', i === 0 ? location.pathname + location.search : '#' + STATE.d.weeks[i].date); } catch (e) {}
  paint();
  if (focus) { var b = document.querySelector('.wk[data-week="' + i + '"]'); if (b) b.focus(); }
}
var LINK_ICON = '<svg class="ext" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M9 7h8v8"/></svg><span class="sr">(opens in Gospel Library)</span>';

/* ---- add-to-calendar menus ---- */
function closeMenus(except) {
  Array.prototype.forEach.call(document.querySelectorAll('.menu.open'), function (m) {
    if (m === except) return; m.classList.remove('open');
    var b = m.parentNode.querySelector('.add'); if (b) b.setAttribute('aria-expanded', 'false');
  });
}
document.addEventListener('click', function (e) {
  var wk = e.target.closest && e.target.closest('.wk');
  if (wk) { pickWeek(+wk.getAttribute('data-week')); window.scrollTo({ top: 0 }); return; }
  var b = e.target.closest && e.target.closest('.add');
  if (b) {
    var m = b.parentNode.querySelector('.menu'), open = !m.classList.contains('open');
    closeMenus(m); m.classList.toggle('open', open); b.setAttribute('aria-expanded', String(open));
    if (open) { var first = m.querySelector('a'); if (first) first.focus(); }
    return;
  }
  if (e.target.closest && e.target.closest('.menu a')) { setTimeout(closeMenus, 0); return; }
  closeMenus();
});
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape') closeMenus();
  if (e.target.classList && e.target.classList.contains('wk') && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')) {
    pickWeek(STATE.week + (e.key === 'ArrowRight' ? 1 : -1), true); e.preventDefault();
  }
});

load().then(function (d) {
  if (!d || d.ok === false || d.error) throw new Error((d && d.error) || 'unavailable');
  render(d);
}).catch(function () {
  $('main').innerHTML = '<p class="status">The bulletin isn’t available right now. Please check back in a few minutes.</p>';
});
</script>
