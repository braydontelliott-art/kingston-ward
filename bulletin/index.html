<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kingston Ward · Bulletin</title>
<meta name="description" content="This week's sacrament meeting program and upcoming events for the Kingston Ward.">
<meta name="theme-color" content="#1E4D45">
<link rel="icon" href="../favicon.png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ground:#1E4D45; --ground-ink:#FFFFFF; --ground-soft:#D3E3DF;
  --page:#F6F7F5; --card:#FFFFFF; --ink:#1A1F1E; --muted:#5A6462; --soft:#3E4846;
  --line:#ECEEEC; --line-2:#DDE1DF; --btn-line:#CDD3D1;
  --serif:'Instrument Serif', Georgia, 'Times New Roman', serif;
  --sans:'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#173B35; --ground-soft:#B9D1CB;
    --page:#111514; --card:#1A201F; --ink:#EEF2F0; --muted:#A3AEAB; --soft:#C6CFCC;
    --line:#262E2C; --line-2:#2E3735; --btn-line:#3A4542;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--page);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.4}
a{color:inherit}
.wrap{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.hero{background:var(--ground);color:var(--ground-ink);padding:calc(28px + env(safe-area-inset-top)) 24px 36px;display:flex;flex-direction:column;gap:48px}
.ward{font-size:15px;font-weight:600;letter-spacing:.01em}
.when{font-size:14px;color:var(--ground-soft)}
h1{margin:16px 0 0;font-family:var(--serif);font-weight:400;font-size:clamp(46px,14vw,64px);line-height:.95;letter-spacing:-.01em}
h1 em{font-style:italic}
.people{padding:24px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;justify-content:space-between;gap:16px;font-size:15px}
.row .k{color:var(--muted)} .row .v{font-weight:600;text-align:right}
.program{margin:0 16px;padding:8px 20px;background:var(--card);border-radius:18px;list-style:none}
.program li{padding:20px 0;border-bottom:1px solid var(--line)}
.program li:last-child{border-bottom:0}
.lbl{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
.hymn{font-family:var(--serif);font-size:26px;line-height:1.1}
.part{font-family:var(--serif);font-style:italic;font-size:22px;color:var(--soft)}
.program li.row{padding:20px 0}
.notes{margin:20px 16px 0;padding:20px;background:var(--card);border-radius:18px;display:flex;flex-direction:column;gap:14px}
.notes p{margin:0;white-space:pre-line}
.notes .t{font-weight:600}
section.up{padding:36px 24px 0}
h2{margin:0 0 14px;font-family:var(--serif);font-weight:400;font-size:30px}
.ev{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 0;border-top:1px solid var(--line-2)}
.ev .name{font-size:16px;font-weight:600}
.ev .meta{font-size:14px;color:var(--muted)}
.addwrap{position:relative;flex:none}
.add{display:flex;align-items:center;gap:6px;min-height:44px;padding:0 14px;border-radius:12px;border:1px solid var(--btn-line);background:transparent;color:var(--ink);font:600 13px var(--sans);cursor:pointer}
.add svg{color:var(--ground)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .add svg{color:var(--ground-soft)}}
.menu{position:absolute;right:0;top:calc(100% + 6px);z-index:5;min-width:230px;white-space:nowrap;background:var(--card);border:1px solid var(--line-2);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.14);padding:6px;display:none}
.menu.open{display:block}
.menu a{display:flex;align-items:center;min-height:44px;padding:0 12px;border-radius:8px;text-decoration:none;font-size:15px}
.menu a:hover,.menu a:focus-visible{background:var(--line)}
.empty{color:var(--muted);font-size:15px;padding:8px 0 0}
footer{margin-top:auto;padding:32px 24px calc(32px + env(safe-area-inset-bottom));font-size:13px;color:var(--muted)}
.status{padding:48px 24px;color:var(--muted)}
.skel{background:var(--line);border-radius:8px;height:18px;margin:10px 0}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <div class="ward" id="ward">Kingston Ward</div>
    <div>
      <div class="when" id="when">&nbsp;</div>
      <h1 id="title">Sacrament meeting</h1>
    </div>
  </header>
  <main id="main"><div class="status"><div class="skel" style="width:60%"></div><div class="skel" style="width:80%"></div><div class="skel" style="width:40%"></div></div></main>
  <footer>kwbishopric.org/bulletin</footer>
</div>

<script>
/* Kingston Ward · public bulletin.
   Reads the bulletin from the "App API" deployment with fn "publicBulletin" — no sign-in.
   That endpoint returns only what is already public on the printed program. */
var API_URL = 'https://script.google.com/macros/s/AKfycbxTmstrn1ETmsEnobIx9-MB12Mw8LCsdHlzGO41-UxkxitVuE224xnl8wTXhK3BlzRo/exec';
var TZ = 'America/Denver';

/* Sample data: open the page with ?sample to preview the design without the API. */
var SAMPLE = {
  ok: true, ward: 'Kingston Ward',
  meeting: {
    title: 'Fast & testimony meeting', date: '2026-11-01', time: '11:30 AM',
    roles: [{ label: 'Conducting', name: 'Ken' }, { label: 'Chorister', name: 'Jim Manning' }, { label: 'Organist', name: 'Meg Naisbitt' }],
    items: [
      { type: 'hymn', label: 'Opening hymn', number: 138, title: 'Bless Our Fast, We Pray' },
      { type: 'part', text: 'Ward & stake business' },
      { type: 'hymn', label: 'Sacrament hymn', number: 191, title: 'Behold the Great Redeemer Die' },
      { type: 'part', text: 'Administration of the sacrament' },
      { type: 'part', text: 'Bearing of testimonies' },
      { type: 'hymn', label: 'Closing hymn', number: 0, title: '[Hymn title]' },
      { type: 'person', label: 'Closing prayer', name: '[Name]' }
    ]
  },
  announcements: [],
  events: [
    { id: 'sample-1', title: '[Ward event]', start: '2026-11-07T18:00:00-07:00', end: '2026-11-07T20:00:00-07:00', location: '[Place]' },
    { id: 'sample-2', title: '[All-day event]', start: '2026-11-14', allDay: true, location: '' }
  ]
};

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function $(id) { return document.getElementById(id); }

function load() {
  if (/[?&]sample\b/.test(location.search)) return Promise.resolve(SAMPLE);
  return fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: 'publicBulletin' }) })
    .then(function (r) { return r.json(); });
}

/* ---- dates ---- */
function ymdDate(ymd) { var p = ymd.split('-'); return new Date(Date.UTC(+p[0], +p[1] - 1, +p[2], 12)); }
function fmtLongDay(ymd) { return ymdDate(ymd).toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', timeZone: 'UTC' }); }
function isAllDay(ev) { return ev.allDay || /^\d{4}-\d{2}-\d{2}$/.test(ev.start); }
function fmtEventWhen(ev) {
  if (isAllDay(ev)) return ymdDate(ev.start).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', timeZone: 'UTC' });
  var d = new Date(ev.start);
  var day = d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', timeZone: TZ });
  var t = d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', timeZone: TZ }).replace(':00', '');
  return day + ' · ' + t;
}

/* ---- calendar links ---- */
function utcStamp(d) { return d.toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, ''); }
function ymdCompact(ymd) { return ymd.replace(/-/g, ''); }
function nextDay(ymd) { var d = ymdDate(ymd); d.setUTCDate(d.getUTCDate() + 1); return d.toISOString().slice(0, 10); }
function evRange(ev) {
  if (isAllDay(ev)) { var s = ev.start.slice(0, 10); return { allDay: true, s: ymdCompact(s), e: ymdCompact(ev.end ? nextDay(ev.end.slice(0, 10)) : nextDay(s)) }; }
  var start = new Date(ev.start), end = ev.end ? new Date(ev.end) : new Date(start.getTime() + 60 * 60 * 1000);
  return { allDay: false, s: utcStamp(start), e: utcStamp(end) };
}
function icsText(v) { return String(v || '').replace(/\\/g, '\\\\').replace(/\n/g, '\\n').replace(/([,;])/g, '\\$1'); }
function icsFor(ev) {
  var r = evRange(ev);
  var lines = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Kingston Ward//Bulletin//EN', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH', 'BEGIN:VEVENT',
    'UID:' + icsText(ev.id || (r.s + '-' + ev.title)) + '@kwbishopric.org',
    'DTSTAMP:' + utcStamp(new Date()),
    r.allDay ? 'DTSTART;VALUE=DATE:' + r.s : 'DTSTART:' + r.s,
    r.allDay ? 'DTEND;VALUE=DATE:' + r.e : 'DTEND:' + r.e,
    'SUMMARY:' + icsText(ev.title)];
  if (ev.location) lines.push('LOCATION:' + icsText(ev.location));
  if (ev.description) lines.push('DESCRIPTION:' + icsText(ev.description));
  lines.push('END:VEVENT', 'END:VCALENDAR');
  return lines.join('\r\n');
}
function googleUrl(ev) {
  var r = evRange(ev);
  var q = 'action=TEMPLATE&text=' + encodeURIComponent(ev.title || '') + '&dates=' + r.s + '/' + r.e;
  if (!r.allDay) q += '&ctz=' + encodeURIComponent(TZ);
  if (ev.location) q += '&location=' + encodeURIComponent(ev.location);
  if (ev.description) q += '&details=' + encodeURIComponent(ev.description);
  return 'https://calendar.google.com/calendar/render?' + q;
}
function slug(s) { return String(s || 'event').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 40) || 'event'; }

var CAL_ICON = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18M12 14v4M10 16h4"/></svg>';

/* ---- render ---- */
function titleHtml(t) {
  // Italicize "testimony" in the fast-meeting title, as in the design; everything else plain.
  return esc(t).replace(/\btestimony\b/i, function (m) { return '<em>' + m + '</em>'; });
}
function render(d) {
  var m = d.meeting || {};
  if (d.ward) { $('ward').textContent = d.ward; }
  document.title = (d.ward || 'Kingston Ward') + ' · Bulletin';
  $('when').textContent = (m.date ? fmtLongDay(m.date) : '') + (m.time ? ' · ' + m.time : '');
  $('title').innerHTML = titleHtml(m.title || 'Sacrament meeting');

  var h = '';
  var roles = (m.roles || []).filter(function (r) { return r && r.name; });
  if (roles.length) {
    h += '<section class="people" aria-label="Meeting leaders">' + roles.map(function (r) {
      return '<div class="row"><span class="k">' + esc(r.label) + '</span><span class="v">' + esc(r.name) + '</span></div>';
    }).join('') + '</section>';
  }
  var items = m.items || [];
  if (items.length) {
    h += '<ol class="program" aria-label="Order of meeting">' + items.map(function (it) {
      if (it.type === 'hymn') {
        var no = it.number ? ' · No. ' + esc(it.number) : '';
        return '<li><span class="lbl">' + esc(it.label || 'Hymn') + no + '</span><span class="hymn">' + esc(it.title || '') + '</span></li>';
      }
      if (it.type === 'person' || it.type === 'talk') {
        return '<li class="row"><span class="k">' + esc(it.label || '') + '</span><span class="v">' + esc(it.name || '') + '</span></li>';
      }
      return '<li><span class="part">' + esc(it.text || it.label || '') + '</span></li>';
    }).join('') + '</ol>';
  }
  var notes = (d.announcements || []).filter(function (a) { return a && (a.title || a.text); });
  if (notes.length) {
    h += '<section class="notes" aria-label="Announcements">' + notes.map(function (a) {
      return '<div>' + (a.title ? '<p class="t">' + esc(a.title) + '</p>' : '') + (a.text ? '<p>' + esc(a.text) + '</p>' : '') + '</div>';
    }).join('') + '</section>';
  }
  var evs = d.events || [];
  h += '<section class="up" aria-labelledby="up-h"><h2 id="up-h">Coming up</h2>';
  if (!evs.length) h += '<p class="empty">Nothing on the calendar yet.</p>';
  h += evs.map(function (ev, i) {
    var ics = 'data:text/calendar;charset=utf-8,' + encodeURIComponent(icsFor(ev));
    var meta = fmtEventWhen(ev) + (ev.location ? ' · ' + esc(ev.location) : '');
    return '<div class="ev"><div><div class="name">' + esc(ev.title) + '</div><div class="meta">' + meta + '</div></div>' +
      '<div class="addwrap"><button type="button" class="add" aria-haspopup="true" aria-expanded="false" aria-controls="m' + i + '" aria-label="Add ' + esc(ev.title) + ' to calendar">' + CAL_ICON + 'Add to calendar</button>' +
      '<div class="menu" id="m' + i + '" role="menu">' +
        '<a role="menuitem" href="' + ics + '" download="' + slug(ev.title) + '.ics">Apple, Outlook &amp; others</a>' +
        '<a role="menuitem" href="' + esc(googleUrl(ev)) + '" target="_blank" rel="noopener">Google Calendar</a>' +
      '</div></div></div>';
  }).join('');
  h += '</section>';
  $('main').innerHTML = h;
}

/* ---- add-to-calendar menus ---- */
function closeMenus(except) {
  Array.prototype.forEach.call(document.querySelectorAll('.menu.open'), function (m) {
    if (m === except) return; m.classList.remove('open');
    var b = m.parentNode.querySelector('.add'); if (b) b.setAttribute('aria-expanded', 'false');
  });
}
document.addEventListener('click', function (e) {
  var b = e.target.closest && e.target.closest('.add');
  if (b) {
    var m = b.parentNode.querySelector('.menu'), open = !m.classList.contains('open');
    closeMenus(m); m.classList.toggle('open', open); b.setAttribute('aria-expanded', String(open));
    if (open) { var first = m.querySelector('a'); if (first) first.focus(); }
    return;
  }
  if (e.target.closest && e.target.closest('.menu a')) { setTimeout(closeMenus, 0); return; }
  closeMenus();
});
document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeMenus(); });

load().then(function (d) {
  if (!d || d.ok === false) throw new Error((d && d.error) || 'unavailable');
  render(d);
}).catch(function () {
  $('main').innerHTML = '<p class="status">The bulletin isn’t available right now. Please check back in a few minutes.</p>';
});
</script>
</body>
</html>
