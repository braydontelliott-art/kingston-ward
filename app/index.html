<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kingston Ward · Bishopric</title>
<meta name="theme-color" content="#0d9488">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bishopric">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f7fa;--paper:#fff;--ink:#0f172a;--muted:#64748b;--line:#e6e9ef;--accent:#0d9488;--danger:#c2410c}
@media (prefers-color-scheme:dark){:root{--bg:#0b1016;--paper:#131a23;--ink:#e7edf4;--muted:#8a97a8;--line:#222c38;--accent:#2dd4bf;--danger:#fb923c}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px 16px calc(24px + env(safe-area-inset-bottom))}
.card{width:100%;max-width:380px;background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:32px 24px;text-align:center;box-shadow:0 12px 32px rgba(15,23,42,.08)}
.logo{width:72px;height:72px;border-radius:18px;display:block;margin:0 auto 16px}
h1{font-size:22px;margin:0 0 4px;letter-spacing:-.01em}
p{color:var(--muted);margin:0 0 22px}
#gbtn{display:flex;justify-content:center;min-height:44px}
.err{color:var(--danger);font-size:14px;margin:16px 0 0;min-height:1em}
.small{font-size:13px;color:var(--muted);margin:18px 0 0}
.spin{width:28px;height:28px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);margin:8px auto 0;animation:s .9s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
.gbtn{display:inline-flex;align-items:center;gap:12px;background:#fff;color:#1f1f1f;border:1px solid #dadce0;border-radius:999px;padding:11px 22px;font:500 15px/1 Inter,-apple-system,sans-serif;cursor:pointer;min-width:260px;justify-content:center}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:10px 18px;font:inherit;font-weight:600;cursor:pointer;color:var(--ink)}
</style>
</head>
<body>
<div class="wrap"><div class="card" id="card">
  <img class="logo" src="icon-192.png" alt="">
  <h1>Kingston Ward</h1>
  <p>Bishopric</p>
  <div class="spin" id="spin"></div>
</div></div>
<script>
/* Kingston Ward · Bishopric — installable shell.
   Signs in with Google (name + email only), then loads the Bishopric Board from its Apps Script API.
   Nothing ward-related lives in this file; the API checks every request against the Members list. */
var API_URL = 'https://script.google.com/macros/s/AKfycbxTmstrn1ETmsEnobIx9-MB12Mw8LCsdHlzGO41-UxkxitVuE224xnl8wTXhK3BlzRo/exec';           // "App API" deployment of the Bishopric Board script
var CLIENT_ID = '781984210146-toor95vmf1716m7qefm9utperhj0n56u.apps.googleusercontent.com';
var KEY = 'bb_session';

function store(k, v) { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) {} }
function read(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function post(body) {
  return fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) })
    .then(function (r) { return r.json(); });
}
function card(html) { document.getElementById('card').innerHTML = '<img class="logo" src="icon-192.png" alt=""><h1>Kingston Ward</h1><p>Bishopric</p>' + html; }
function iosStandalone() { return window.navigator.standalone === true; }

// Returning from Google's full-page sign-in (iPhone home-screen app): Google sends the ID token straight
// back to this page in the URL fragment — no stop on script.google.com.
var RETURN_TOKEN = '', RETURN_ERR = '';
(function () {
  var h = location.hash.replace(/^#/, ''); if (!h) return;
  var p = {}; h.split('&').forEach(function (kv) { var i = kv.indexOf('='); if (i > 0) p[kv.slice(0, i)] = decodeURIComponent(kv.slice(i + 1).replace(/\+/g, ' ')); });
  if (p.session) store(KEY, p.session);
  if (p.id_token) { if (p.state && p.state === read('bb_state')) RETURN_TOKEN = p.id_token; else RETURN_ERR = 'Sign-in didn’t match. Please try again.'; }
  if (p.error && p.error !== 'access_denied') RETURN_ERR = 'Google sign-in didn’t go through. Please try again.';
  store('bb_state', null);
  history.replaceState(null, '', location.pathname + location.search);
})();
function rand() { var a = new Uint8Array(16); crypto.getRandomValues(a); return Array.prototype.map.call(a, function (b) { return ('0' + b.toString(16)).slice(-2); }).join(''); }
function fullPageSignIn() {
  var st = rand(); store('bb_state', st);
  var q = { client_id: CLIENT_ID, redirect_uri: location.origin + location.pathname, response_type: 'id_token',
            scope: 'openid email profile', nonce: rand(), state: st, prompt: 'select_account' };
  var hint = read('bb_email'); if (hint) { q.login_hint = hint; delete q.prompt; }
  location.href = 'https://accounts.google.com/o/oauth2/v2/auth?' + Object.keys(q).map(function (k) { return k + '=' + encodeURIComponent(q[k]); }).join('&');
}
function useFullPage() { return iosStandalone() || /[?&]fullpage=1/.test(location.search); }

function boot() {
  if (RETURN_TOKEN) { var t = RETURN_TOKEN; RETURN_TOKEN = ''; return onCredential({ credential: t }); }
  if (RETURN_ERR) { var m = RETURN_ERR; RETURN_ERR = ''; return signInScreen(m); }
  var s = read(KEY);
  if (!s) return signInScreen();
  // Start downloading the data now, alongside the app, instead of after it loads (the app picks this request up).
  window.__BB_BOOT = post({ fn: 'getAll', args: [], session: s });
  window.__BB_BOOT.catch(function () {});
  // Fast start: open the copy of the app saved on this device; the app quietly fetches a fresh copy for next time.
  var saved = read(APP_HTML);
  // Swap the page only after it has finished loading: replacing it mid-load adds the app under this sign-in card instead.
  if (saved) { if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', function () { show(saved); }); else show(saved); return; }
  card('<div class="spin"></div><p class="small">Loading…</p>');
  post({ fn: 'app', session: s }).then(function (j) {
    if (!j.ok) { if (j.auth) { store(KEY, null); return signInScreen(); } throw new Error(j.error); }
    store(APP_HTML, j.result); show(j.result);
  }).catch(function (e) {
    card('<p class="err">Couldn’t load: ' + String(e.message || e) + '</p><button class="btn" onclick="boot()">Try again</button>');
  });
}

var APP_HTML = 'bb_app_html';
function show(html) {
  var shim = '<script>(' + appShim.toString() + ')(' + JSON.stringify(API_URL) + ',' + JSON.stringify(KEY) + ',' + JSON.stringify(APP_HTML) + ');<\/script>';
  // The app page has no icon or home-screen tags of its own: carry this page's over so the tab icon and home-screen app stay.
  var keep = [].map.call(document.querySelectorAll('head link[rel~="icon"], head link[rel="apple-touch-icon"], head link[rel="manifest"], head meta[name="theme-color"], head meta[name^="apple-mobile-web-app"], head meta[name="mobile-web-app-capable"]'), function (el) { var c = el.cloneNode(); if (c.href) c.setAttribute('href', el.href); return c.outerHTML; }).join('');
  document.open(); document.write(html.replace(/<head>/i, '<head>' + keep + shim)); document.close();
}

// Runs inside the loaded app: stands in for Apps Script's google.script.run.
function appShim(API, KEY, APP_HTML) {
  // Wipe what this device saved for the app (sign-in, saved data, saved app copy).
  function wipe() { try { Object.keys(localStorage).forEach(function (k) { if (k === KEY || k === APP_HTML || k === 'bb_photos' || k.indexOf('bb_data:') === 0) localStorage.removeItem(k); }); } catch (e) {} }
  function sess() { try { return localStorage.getItem(KEY); } catch (e) { return null; } }
  function call(fn, args, ok, fail) {
    // The first getAll uses the request the page already started while the app was loading.
    var early = fn === 'getAll' && window.__BB_BOOT; if (early) window.__BB_BOOT = null;
    (early || fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: fn, args: args, session: sess() }) })
      .then(function (r) { return r.json(); }))
      .then(function (j) {
        if (j.ok) { if (ok) ok(j.result); return; }
        if (j.auth) { wipe(); location.reload(); return; }
        if (fail) fail(new Error(j.error || 'Something went wrong'));
      })
      .catch(function (e) { if (fail) fail(new Error('Couldn’t reach the server. Check your connection and try again.')); });
  }
  function runner(ok, fail) {
    return new Proxy({}, { get: function (_, k) {
      if (k === 'withSuccessHandler') return function (h) { return runner(h, fail); };
      if (k === 'withFailureHandler') return function (h) { return runner(ok, h); };
      return function () { call(k, [].slice.call(arguments), ok, fail); };
    } });
  }
  window.google = { script: { run: runner(null, null), host: { close: function () {} } } };
  window.__BB_APP = true;
  // Keep the saved copy of the app current for next time (after it has loaded).
  setTimeout(function () {
    fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: 'app', session: sess() }) })
      .then(function (r) { return r.json(); })
      .then(function (j) { if (j.ok && j.result) { try { if (localStorage.getItem(APP_HTML) !== j.result) localStorage.setItem(APP_HTML, j.result); } catch (e) {} } })
      .catch(function () {});
  }, 8000);
  window.__BB_signOut = function () {
    var s = sess();
    wipe();
    fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: 'signOut', session: s }) })
      .finally(function () { location.reload(); });
  };
}

function signInScreen(msg) {
  card('<div id="gbtn"></div><p class="err" id="err">' + (msg || '') + '</p><p class="small">Use the Google account on the bishopric list.</p>');
  if (!API_URL || !CLIENT_ID) { document.getElementById('err').textContent = 'Sign-in is being set up.'; return; }
  if (useFullPage()) {
    document.getElementById('gbtn').innerHTML = '<button class="gbtn" type="button" onclick="fullPageSignIn()"><svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.6 5.4 2.7 13.3l7.9 6.1C12.5 13.6 17.8 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.7 6c4.5-4.2 6.9-10.3 6.9-17.7z"/><path fill="#FBBC05" d="M10.6 28.6c-.5-1.4-.8-3-.8-4.6s.3-3.2.8-4.6l-7.9-6.1C1 16.6 0 20.2 0 24s1 7.4 2.7 10.7l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.7-6c-2.1 1.4-4.9 2.3-8.2 2.3-6.2 0-11.5-4.1-13.4-9.9l-7.9 6.1C6.6 42.6 14.6 48 24 48z"/></svg>Sign in with Google</button>';
    return;
  }
  var s = document.createElement('script');
  s.src = 'https://accounts.google.com/gsi/client'; s.async = true;
  s.onload = function () {
    var redirect = iosStandalone();
    google.accounts.id.initialize({
      client_id: CLIENT_ID, callback: onCredential, auto_select: true, cancel_on_tap_outside: false,
      ux_mode: redirect ? 'redirect' : 'popup', login_uri: redirect ? API_URL : undefined, itp_support: true
    });
    google.accounts.id.renderButton(document.getElementById('gbtn'), { theme: 'filled_blue', size: 'large', shape: 'pill', text: 'signin_with', width: 280 });
    if (!redirect) google.accounts.id.prompt();
  };
  s.onerror = function () { document.getElementById('err').textContent = 'Couldn’t load Google sign-in. Check your connection.'; };
  document.head.appendChild(s);
}
function onCredential(resp) {
  card('<div class="spin"></div><p class="small">Signing in…</p>');
  post({ fn: 'signIn', idToken: resp.credential }).then(function (j) {
    if (!j.ok) return signInScreen(j.error);
    store(KEY, j.result.session); if (j.result.email) store('bb_email', j.result.email); boot();
  }).catch(function () { signInScreen('Couldn’t reach the server. Try again.'); });
}
boot();
</script>
</body>
</html>
