<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kingston Ward</title>
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kingston Ward">
<meta name="theme-color" content="#0d9488">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{--bg:#f5f7fa;--ink:#0f172a;--muted:#64748b;--card:#fff;--line:#e6e9ef}
@media (prefers-color-scheme:dark){:root{--bg:#0b1016;--ink:#e7edf4;--muted:#8a97a8;--card:#131a23;--line:#222c38}}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:24px 16px;box-sizing:border-box}
.c{max-width:420px;width:100%;text-align:center}
img{width:112px;height:112px;border-radius:26px}
h1{margin:16px 0 4px;font-size:26px}
p{color:var(--muted);margin:0 0 20px}
a.b{display:block;background:#0d9488;color:#fff;text-decoration:none;font-weight:600;padding:14px;border-radius:14px}
.tip{margin-top:22px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:left;font-size:14px;color:var(--muted)}
</style>
</head>
<body>
<div class="c">
  <img src="icon-512.png" alt="">
  <h1>Kingston Ward</h1>
  <p>Bishopric Board</p>
  <a class="b" id="go" href="https://script.google.com/macros/s/AKfycbyyPPLA0KPKL_y8VmvBz1csunQe1QwxOneC1MgGzLdJS5xCQwkmFwRu6G56xVl-MlPB/exec">Open the Bishopric Board</a>
  <div class="tip" id="tip"><b>Add to your home screen:</b> on iPhone, tap Share, then “Add to Home Screen.” On Android, tap ⋮, then “Add to Home screen.”</div>
</div>
<script>
// Opened from the home-screen icon: go straight to the app.
if (window.navigator.standalone || (window.matchMedia && matchMedia('(display-mode: standalone)').matches)) {
  document.getElementById('tip').style.display = 'none';
  location.replace(document.getElementById('go').href);
}
</script>
</body>
</html>
