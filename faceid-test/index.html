<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Face ID test">
<title>Face ID test</title>
<style>
:root{color-scheme:light dark;--bg:#fff;--fg:#1c1626;--mut:#655d72;--btn:#5b3fa8;--box:#f1eff5}
@media (prefers-color-scheme:dark){:root{--bg:#120c1a;--fg:#f4f1f8;--mut:#b5adc2;--btn:#7a5cd0;--box:#231b30}}
body{font:17px/1.4 -apple-system,system-ui,sans-serif;margin:0;padding:24px 16px 48px;background:var(--bg);color:var(--fg)}
main{max-width:480px;margin:auto}p{color:var(--mut)}
button{display:block;width:100%;font:inherit;font-weight:600;padding:16px;margin:12px 0;border:0;border-radius:12px;background:var(--btn);color:#fff}
pre{white-space:pre-wrap;word-break:break-word;font:14px/1.45 ui-monospace,monospace;background:var(--box);padding:12px;border-radius:10px}
</style></head>
<body><main>
<h1>Face ID test</h1>
<p>Made-up text only. Nothing here touches Wardy or leaves this phone.</p>
<button id="a">1. Create Face ID key</button>
<button id="b">2. Unlock with Face ID</button>
<button id="c">3. Erase this page's saved data</button>
<pre id="o"></pre>
</main>
<script>
var o = document.getElementById('o'), KEY = 'faceidTestNote', mem = null, lastPrint = '';
var salt = new TextEncoder().encode('wardy-faceid-test-salt-000000000');
function log(s) { o.textContent += s + '\n'; }
function rnd(n) { return crypto.getRandomValues(new Uint8Array(n)); }
function hex(b) { return Array.from(new Uint8Array(b)).map(function (x) { return x.toString(16).padStart(2, '0'); }).join(''); }
function unhex(h) { return new Uint8Array(h.match(/../g).map(function (x) { return parseInt(x, 16); })); }
function fail(e) { log('FAIL ' + (e && e.name || '') + ': ' + (e && e.message || e)); }
function read() { try { return localStorage.getItem(KEY) || ''; } catch (e) { return ''; } }
function write(v) { try { localStorage.setItem(KEY, v); } catch (e) { log('note: could not write page storage'); } }
(async function () {
  var av = 'unknown', caps = {};
  try { av = await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable(); } catch (e) { av = 'no passkey support'; }
  try { caps = await PublicKeyCredential.getClientCapabilities(); } catch (e) {}
  log('INFO ' + (navigator.userAgent.match(/(iPhone OS [\d_]+|Mac OS X [\d_]+|Android [\d.]+)/) || [''])[0]);
  log('INFO opened from: ' + (navigator.standalone ? 'home-screen icon' : 'browser'));
  log('INFO Face ID available: ' + av + ' | key feature: ' + caps['extension:prf']);
})();
document.getElementById('a').onclick = function () {
  navigator.credentials.create({ publicKey: {
    challenge: rnd(32), rp: { name: 'Face ID test' },
    user: { id: rnd(16), name: 'Face ID test', displayName: 'Face ID test' },
    pubKeyCredParams: [{ type: 'public-key', alg: -7 }],
    authenticatorSelection: { residentKey: 'required', userVerification: 'required' },
    extensions: { prf: { eval: { first: salt } } }
  } }).then(function (c) {
    var r = c.getClientExtensionResults();
    log('PASS key created | key feature on: ' + (r.prf && r.prf.enabled));
  }).catch(fail);
};
document.getElementById('b').onclick = function () {
  navigator.credentials.get({ publicKey: {
    challenge: rnd(32), userVerification: 'required', extensions: { prf: { eval: { first: salt } } }
  } }).then(async function (c) {
    var r = c.getClientExtensionResults();
    if (!r.prf || !r.prf.results || !r.prf.results.first) throw new Error('Face ID worked but gave no key');
    var bytes = r.prf.results.first;
    var print = hex(await crypto.subtle.digest('SHA-256', bytes)).slice(0, 8);
    var k = await crypto.subtle.importKey('raw', bytes, 'AES-GCM', false, ['encrypt', 'decrypt']);
    log('PASS Face ID gave key ' + print + (lastPrint ? (print === lastPrint ? ' (same as before)' : ' (DIFFERENT from ' + lastPrint + ')') : ''));
    lastPrint = print;
    var t = read() || mem;
    if (!t) {
      var iv = rnd(12), ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv: iv }, k, new TextEncoder().encode('made-up test note'));
      mem = hex(iv) + ':' + hex(ct); write(mem);
      log('PASS sealed a made-up note. Tap 2 again to open it.');
      return;
    }
    var p = t.split(':');
    var pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unhex(p[0]) }, k, unhex(p[1]));
    mem = t;
    log('PASS opened the note: ' + new TextDecoder().decode(pt));
  }).catch(fail);
};
document.getElementById('c').onclick = function () {
  try { localStorage.clear(); sessionStorage.clear(); log('PASS page data erased: ' + (read() ? 'still there' : 'empty') + '. Tap 2 to see whether Face ID still opens the note.'); } catch (e) { fail(e); }
};
</script>
</body></html>
